<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2387" />
      <stop offset="50%" stop-color="#E94057" />
      <stop offset="100%" stop-color="#F27121" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E94057" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <drop-shadow dx="0" dy="8" stdDeviation="12" flood-color="#E94057" flood-opacity="0.4"/>
    </filter>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <drop-shadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-gradient)" />
  
  <!-- Subtle decorative grid lines -->
  <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />

  <!-- Ambient light glow behind logo -->
  <circle cx="280" cy="200" r="140" fill="url(#brand-gradient)" opacity="0.15" filter="url(#glow)" />

  <!-- Left Side: Interactive Logo Representation -->
  <g transform="translate(180, 100)" filter="url(#subtle-shadow)">
    <!-- Outer Rounded Square -->
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#brand-gradient)" />

    <!-- Camera Outer Ring (X-aligned) -->
    <rect x="35" y="35" width="130" height="130" rx="32" fill="none" stroke="#FFFFFF" stroke-width="9" />

    <!-- Lens/Shutter (Representing X) -->
    <circle cx="100" cy="100" r="40" fill="none" stroke="#FFFFFF" stroke-width="9" />
    
    <!-- The 'X' Shutter Details -->
    <path d="M 74,74 L 86,86 M 126,74 L 114,86 M 74,126 L 86,114 M 126,126 L 114,114" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />

    <!-- Small Flash/Sensor dot -->
    <circle cx="145" cy="55" r="10" fill="#FFFFFF" />
  </g>

  <!-- Right Side: Content & Taglines -->
  <g transform="translate(450, 120)">
    <!-- Wordmark -->
    <text x="0" y="50" font-family="'Inter', -apple-system, sans-serif" font-size="80" font-weight="900" fill="url(#text-gradient)" letter-spacing="2">InstaX</text>
    
    <!-- Tagline -->
    <text x="5" y="95" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="0.5">A Premium, Blazing-Fast Social Media Platform</text>
    
    <!-- Sub-tagline/Description -->
    <text x="5" y="125" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#64748B">Next.js 16 • React 19 • Tailwind v4 • Prisma • Neon PostgreSQL • Clerk • UploadThing</text>

    <!-- Built with badges representation (styled SVGs) -->
    <g transform="translate(5, 155)">
      <!-- Server Components Pill -->
      <rect x="0" y="0" width="150" height="28" rx="6" fill="#1E293B" />
      <text x="12" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">⚡ Server Components</text>

      <!-- Optimized Pill -->
      <rect x="160" y="0" width="130" height="28" rx="6" fill="#1E293B" />
      <text x="172" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399">🚀 Web-Optimized</text>

      <!-- UX Pill -->
      <rect x="300" y="0" width="120" height="28" rx="6" fill="#1E293B" />
      <text x="312" y="18" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#F472B6">🎨 Beautiful UI</text>
    </g>
  </g>
</svg>
