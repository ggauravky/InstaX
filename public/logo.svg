<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Vibrant Modern HSL Gradient -->
    <linearGradient id="instax-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62" />
      <stop offset="50%" stop-color="#FF9966" />
      <stop offset="100%" stop-color="#FF5E62" />
    </linearGradient>
    <linearGradient id="lens-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2387" />
      <stop offset="50%" stop-color="#E94057" />
      <stop offset="100%" stop-color="#F27121" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <drop-shadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Square -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#lens-gradient)" filter="url(#shadow)" />

  <!-- Camera Outer Ring (X-aligned) -->
  <rect x="20" y="20" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-width="5" />

  <!-- Lens/Shutter (Representing X) -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#FFFFFF" stroke-width="5" />
  
  <!-- The 'X' Shutter Details -->
  <path d="M 38,38 L 44,44 M 62,38 L 56,44 M 38,62 L 44,56 M 62,62 L 56,56" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

  <!-- Small Flash/Sensor dot -->
  <circle cx="70" cy="30" r="4.5" fill="#FFFFFF" />
</svg>
