<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Branding Gradient -->
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2387" />
      <stop offset="50%" stop-color="#E94057" />
      <stop offset="100%" stop-color="#F27121" />
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FF7B93" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <drop-shadow dx="0" dy="16" stdDeviation="24" flood-color="#E94057" flood-opacity="0.5"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <drop-shadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" rx="20" fill="url(#bg-gradient)" />

  <!-- Background grid lines for depth -->
  <path d="M 0,90 L 1200,90 M 0,180 L 1200,180 M 0,270 L 1200,270 M 0,360 L 1200,360 M 0,450 L 1200,450 M 0,540 L 1200,540" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1.5" />
  <path d="M 150,0 L 150,630 M 300,0 L 300,630 M 450,0 L 450,630 M 600,0 L 600,630 M 750,0 L 750,630 M 900,0 L 900,630 M 1050,0 L 1050,630" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1.5" />

  <!-- Abstract gradient glow (top-right and bottom-left) -->
  <circle cx="1100" cy="100" r="250" fill="url(#brand-gradient)" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="100" cy="550" r="200" fill="url(#brand-gradient)" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- Core Mockup/Concept Visual Box on Right Side -->
  <g transform="translate(680, 115)" filter="url(#card-shadow)">
    <!-- Main UI Container Mockup -->
    <rect width="440" height="400" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2" />
    
    <!-- UI Header Bar -->
    <rect width="440" height="50" rx="16" fill="#0F172A" />
    <!-- Round window dots -->
    <circle cx="25" cy="25" r="6" fill="#EF4444" />
    <circle cx="45" cy="25" r="6" fill="#F59E0B" />
    <circle cx="65" cy="25" r="6" fill="#10B981" />
    
    <!-- UI Brand Mock Title -->
    <text x="390" y="32" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#E2E8F0" text-anchor="end">InstaX App</text>

    <!-- Post Avatar & Name -->
    <circle cx="40" cy="95" r="18" fill="url(#brand-gradient)" />
    <rect x="70" y="83" width="120" height="10" rx="3" fill="#475569" />
    <rect x="70" y="99" width="70" height="6" rx="2" fill="#334155" />
    
    <!-- Post Image Mockup -->
    <rect x="25" y="130" width="390" height="190" rx="8" fill="#334155" />
    <!-- Gradient play inside post image -->
    <rect x="25" y="130" width="390" height="190" rx="8" fill="url(#brand-gradient)" opacity="0.4" />
    <!-- A sleek checkmark or camera graphic centered in post image -->
    <circle cx="220" cy="225" r="30" fill="#1E293B" opacity="0.8" />
    <path d="M 210,225 L 217,232 L 232,217" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Action Buttons -->
    <circle cx="45" cy="355" r="12" fill="#334155" />
    <path d="M 45,351 C 42,347 37,351 45,359 C 53,351 48,347 45,351 Z" fill="#EF4444" />
    
    <circle cx="80" cy="355" r="12" fill="#334155" />
    <circle cx="115" cy="355" r="12" fill="#334155" />
    
    <!-- Text Post Content preview lines -->
    <rect x="25" y="380" width="300" height="6" rx="2" fill="#475569" />
  </g>

  <!-- Left Side content -->
  <g transform="translate(100, 110)">
    <!-- Mini tag -->
    <rect width="130" height="26" rx="13" fill="url(#brand-gradient)" />
    <text x="65" y="17" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PRODUCTION READY</text>

    <!-- Main Branding Title -->
    <g transform="translate(0, 90)">
      <!-- Logo Mark -->
      <g transform="translate(0, -50)">
        <rect width="60" height="60" rx="16" fill="url(#brand-gradient)" />
        <rect x="11" y="11" width="38" height="38" rx="10" fill="none" stroke="#FFFFFF" stroke-width="3" />
        <circle cx="30" cy="30" r="12" fill="none" stroke="#FFFFFF" stroke-width="3" />
        <path d="M 22,22 L 26,26 M 38,22 L 34,26 M 22,38 L 26,34 M 38,38 L 34,34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
        <circle cx="43" cy="17" r="3" fill="#FFFFFF" />
      </g>
      
      <!-- Logo Wordmark -->
      <text x="80" y="-3" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#text-gradient)" letter-spacing="1.5">InstaX</text>
    </g>

    <!-- Main descriptive paragraph -->
    <text x="0" y="160" font-family="'Inter', -apple-system, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">The Modern Social Media App</text>
    <text x="0" y="200" font-family="'Inter', -apple-system, sans-serif" font-size="36" font-weight="800" fill="#E2E8F0" letter-spacing="-0.5">Built for Ultimate Performance</text>

    <!-- Bullets -->
    <g transform="translate(0, 245)" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
      <!-- Bullet 1 -->
      <circle cx="10" cy="15" r="4" fill="#38BDF8" />
      <text x="25" y="20">Next.js 16 App Router &amp; React Server Components</text>

      <!-- Bullet 2 -->
      <circle cx="10" cy="45" r="4" fill="#34D399" />
      <text x="25" y="50">Server Actions for zero-waterfall instant transactions</text>

      <!-- Bullet 3 -->
      <circle cx="10" cy="75" r="4" fill="#F472B6" />
      <text x="25" y="80">Clerk Authentication &amp; Neon Serverless Postgres DB</text>

      <!-- Bullet 4 -->
      <circle cx="10" cy="105" r="4" fill="#FB7185" />
      <text x="25" y="110">UploadThing drag-and-drop CDN media handling</text>
    </g>

    <!-- Tech icons grid bottom left -->
    <g transform="translate(0, 395)">
      <!-- Boxed pills -->
      <rect x="0" y="0" width="105" height="30" rx="6" fill="#1E293B" />
      <text x="52.5" y="19" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle">NEXT.JS 16</text>
      
      <rect x="115" y="0" width="95" height="30" rx="6" fill="#1E293B" />
      <text x="162.5" y="19" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle">REACT 19</text>
      
      <rect x="220" y="0" width="115" height="30" rx="6" fill="#1E293B" />
      <text x="277.5" y="19" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle">TAILWIND V4</text>

      <rect x="345" y="0" width="110" height="30" rx="6" fill="#1E293B" />
      <text x="400" y="19" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle">NEON PGSQL</text>
    </g>
  </g>
</svg>
